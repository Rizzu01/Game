name: Build Shadow Courier APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx2g

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Java and Gradle
        run: |
          java -version
          gradle --version

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shadow-courier-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
