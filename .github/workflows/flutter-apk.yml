name: Build Shadow Courier Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.0'
          cache: false
      - name: Create Android project
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.rizzu --project-name shadow_courier
      - name: Get dependencies
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shadow-courier-flutter-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
